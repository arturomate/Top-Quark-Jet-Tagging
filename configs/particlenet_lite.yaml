# ──────────────────────────────────────────────────────────────────────────────
# Experiment: ParticleNet-Lite  (pure-PyTorch, no PyG dependency)
#
# A Dynamic Graph CNN / ParticleNet-inspired model operating directly on the
# constituent point cloud.  Constituents are treated as an unordered set;
# a kNN graph is built in (η, φ) space and EdgeConv blocks learn relational
# features.  This respects the set structure that flattened MLPs and CNNs
# ignore.
#
# Usage:
#   python scripts/train.py    --config configs/particlenet_lite.yaml
#   python scripts/evaluate.py --config configs/particlenet_lite.yaml \
#                              --checkpoint results/particlenet_lite_baseline/checkpoints/best.ckpt
#
# NOTE: deterministic=true may trigger a PyTorch warning about torch.cdist
# on some CUDA devices.  If so, set deterministic: false.
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: particlenet_lite_baseline
  seed: 42

# ── Data ───────────────────────────────────────────────────────────────────────
data:
  path: data/raw/train_nominal_000.h5
  input_type: point_cloud     # returns X (N, M, 7) + mask (N, M) — NOT flattened

  validation_fraction: 0.20
  batch_size: 128             # smaller: cdist over (B, 80, 2) needs memory
  num_workers: 0
  pin_memory: auto

  # StandardScaler is not applicable to point-cloud inputs.
  standardize: false

  max_constituents: 80
  constituent_preprocessing: atlas   # ATLAS-inspired centering/rotation/log transforms

  constituent_branches:
    pt:     fjet_clus_pt
    eta:    fjet_clus_eta
    phi:    fjet_clus_phi
    energy: fjet_clus_E

  label_branch:   labels
  weight_branch:  training_weights
  jet_pt_branch:  fjet_pt

# ── Model ──────────────────────────────────────────────────────────────────────
model:
  name: particlenet_lite
  input_dim:  7               # must match num_features from atlas preprocessing
  k:          8               # k-nearest neighbours per particle
  edge_channels: [64, 128, 128]
  classifier_hidden_dims: [128, 64]
  dropout: 0.15
  aggr: max                   # edge aggregation: "max" or "mean"

# ── Optimiser ──────────────────────────────────────────────────────────────────
optimizer:
  name:         adam
  lr:           0.001
  weight_decay: 0.0001

# ── LR scheduler ───────────────────────────────────────────────────────────────
scheduler:
  name:     reduce_on_plateau
  factor:   0.5
  patience: 3
  monitor:  val_loss

# ── Trainer ────────────────────────────────────────────────────────────────────
trainer:
  max_epochs:               50
  accelerator:              auto
  devices:                  1
  deterministic:            true
  early_stopping_patience:  7
  num_sanity_val_steps:     0

# ── Evaluation ─────────────────────────────────────────────────────────────────
evaluation:
  threshold:           0.5
  signal_efficiencies: [0.5, 0.8]
  compute_pt_binned:   true
  pt_bins_gev:
    [350, 550, 750, 950, 1150, 1350, 1550, 1750, 1950, 2150,
     2350, 2550, 2750, 2950, 3150]

# ── Output directories ─────────────────────────────────────────────────────────
outputs:
  root_dir:   results
  figure_dir: figures
