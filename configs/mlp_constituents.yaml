# ──────────────────────────────────────────────────────────────────────────────
# Experiment: Constituent-Level Flattened MLP Baseline
#
# This is the second baseline in the project. It ingests padded constituent
# four-momenta (pT, eta, phi, E) preprocessed with ATLAS-inspired transforms
# and flattened into a 1-D vector before feeding a fully-connected MLP.
#
# Usage:
#   python scripts/train.py    --config configs/mlp_constituents.yaml
#   python scripts/evaluate.py --config configs/mlp_constituents.yaml \
#                              --checkpoint results/mlp_constituents_baseline/checkpoints/best.ckpt
#
# NOTE: This is a simple baseline — it does NOT exploit permutation symmetry or
# spatial structure. More powerful architectures (ParticleNet, Transformer) will
# be implemented in later steps. The expected AUC is somewhat higher than the
# high-level MLP, but the absolute performance should not be over-interpreted.
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: mlp_constituents_baseline
  seed: 42

# ── Data ───────────────────────────────────────────────────────────────────────
data:
  path: data/raw/train_nominal_000.h5
  input_type: constituents          # triggers constituent loading path in DataModule

  validation_fraction: 0.20
  batch_size: 512                   # smaller than HL baseline: constituent tensors are larger
  num_workers: 0
  pin_memory: auto

  # Standardise the flattened feature matrix (fit on training split only).
  standardize: true

  # Truncate each jet to this many leading constituents (sorted by pT descending).
  # 80 is the practical default used by the official ATLAS reference implementation.
  max_constituents: 80

  # Preprocessing recipe to apply to raw constituent arrays.
  # "atlas" → ATLAS-inspired centering, rotation, reflection, log transforms (7 features/constituent).
  constituent_preprocessing: atlas

  # HDF5 branch names for constituent four-vectors.
  constituent_branches:
    pt:     fjet_clus_pt
    eta:    fjet_clus_eta
    phi:    fjet_clus_phi
    energy: fjet_clus_E

  label_branch:   labels
  weight_branch:  training_weights
  jet_pt_branch:  fjet_pt           # loaded in MeV; converted to GeV only in evaluation

# ── Model ──────────────────────────────────────────────────────────────────────
model:
  name: constituent_mlp             # registered in src/models/__init__.py
  input_dim: 560                    # 80 constituents × 7 features = 560
  hidden_dims: [512, 256, 128, 64]
  dropout: 0.15
  use_batchnorm: true

# ── Optimiser ──────────────────────────────────────────────────────────────────
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0001

# ── LR scheduler ───────────────────────────────────────────────────────────────
scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 3
  monitor: val_loss

# ── Trainer ────────────────────────────────────────────────────────────────────
trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  deterministic: true
  early_stopping_patience: 7
  num_sanity_val_steps: 0

# ── Evaluation ─────────────────────────────────────────────────────────────────
evaluation:
  threshold: 0.5
  signal_efficiencies: [0.5, 0.8]
  compute_pt_binned: true
  pt_bins_gev:
    [350, 550, 750, 950, 1150, 1350, 1550, 1750, 1950, 2150,
     2350, 2550, 2750, 2950, 3150]

# ── Output directories (relative to project root) ─────────────────────────────
outputs:
  root_dir:   results
  figure_dir: figures
