# ──────────────────────────────────────────────────────────────────────────────
# Experiment: High-Level Feature MLP Baseline
# Usage:
#   python scripts/train.py    --config configs/mlp_highlevel.yaml
#   python scripts/evaluate.py --config configs/mlp_highlevel.yaml \
#                              --checkpoint results/mlp_highlevel_baseline/best.ckpt
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: mlp_highlevel_baseline
  seed: 42

# ── Data ───────────────────────────────────────────────────────────────────────
data:
  # Path relative to project root (or absolute).
  path: data/raw/train_nominal_000.h5

  # "high_level"  → uses the 15 hand-crafted substructure features listed below.
  # "constituents" → not yet implemented; raises NotImplementedError.
  input_type: high_level

  # Train / validation split fraction.
  validation_fraction: 0.20

  # DataLoader settings.
  batch_size: 1024
  num_workers: 0          # 0 = main-process loading; safe on all platforms.
  pin_memory: auto        # "auto" → True when CUDA is available, else False.

  # Standardise features to zero mean / unit variance (fit on training split only).
  standardize: true

  # Ordered list of HDF5 branch names used as features.
  features:
    - fjet_C2
    - fjet_D2
    - fjet_ECF1
    - fjet_ECF2
    - fjet_ECF3
    - fjet_L2
    - fjet_L3
    - fjet_Qw
    - fjet_Split12
    - fjet_Split23
    - fjet_Tau1_wta
    - fjet_Tau2_wta
    - fjet_Tau3_wta
    - fjet_Tau4_wta
    - fjet_ThrustMaj

  label_branch:    labels
  weight_branch:   training_weights
  jet_pt_branch:   fjet_pt          # Loaded in MeV; converted to GeV inside evaluation.

# ── Model ──────────────────────────────────────────────────────────────────────
model:
  name: mlp             # Registry key; add new keys as more architectures are added.
  input_dim: 15         # Must match len(data.features).
  hidden_dims: [128, 64, 32]
  dropout: 0.10
  use_batchnorm: true

# ── Optimiser ──────────────────────────────────────────────────────────────────
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0001

# ── LR scheduler ───────────────────────────────────────────────────────────────
scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 3
  monitor: val_loss     # Lightning monitor key.

# ── Trainer ────────────────────────────────────────────────────────────────────
trainer:
  max_epochs: 50
  accelerator: auto     # "auto" lets Lightning choose cpu / gpu / mps.
  devices: 1
  deterministic: true
  early_stopping_patience: 7
  num_sanity_val_steps: 0

# ── Evaluation ─────────────────────────────────────────────────────────────────
evaluation:
  threshold: 0.5
  signal_efficiencies: [0.5, 0.8]
  compute_pt_binned: true
  # Bin edges in GeV.  jet pT stored in MeV → divide by 1000 before binning.
  pt_bins_gev:
    [350, 550, 750, 950, 1150, 1350, 1550, 1750, 1950, 2150,
     2350, 2550, 2750, 2950, 3150]

# ── Output directories (relative to project root) ─────────────────────────────
outputs:
  root_dir:   results
  figure_dir: figures
